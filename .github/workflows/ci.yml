name: CI

# Phase 0 process infrastructure.
# Backend/frontend build jobs activate automatically when backend/ and frontend/
# land in later phases. process-validation and security-scan always run and are
# the required status checks on main.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6 # v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  process-validation:
    name: process-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Required design docs exist
        run: |
          test -f docs/DESIGN.md || (echo "docs/DESIGN.md missing" && exit 1)
          test -f docs/UI-UX.md  || (echo "docs/UI-UX.md missing" && exit 1)

      - name: PR template carries the required sections
        run: |
          grep -q "## What changed" .github/pull_request_template.md
          grep -q "## Why" .github/pull_request_template.md
          grep -q "## Design section implemented" .github/pull_request_template.md
          grep -q "## QA criteria affected" .github/pull_request_template.md
          grep -q "## Test evidence" .github/pull_request_template.md

      - name: All workflow actions pinned by SHA
        run: |
          # Every `uses:` line must reference a 40-hex-char commit SHA, never a tag.
          if grep -R "uses:" .github/workflows | grep -vE "@[0-9a-f]{40}"; then
            echo "ERROR: unpinned action found above"
            exit 1
          fi
          echo "all actions SHA-pinned"

  backend:
    name: backend build and test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        working-directory: backend
        run: |
          if [ -f mvnw ]; then ./mvnw -B verify
          elif [ -f gradlew ]; then ./gradlew build
          else echo "ERROR: backend/ exists but has no build wrapper" && exit 1
          fi

  frontend:
    name: frontend build and test
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, build, test
        working-directory: frontend
        run: |
          test -f package-lock.json || (echo "ERROR: lockfile missing; commit package-lock.json" && exit 1)
          npm ci
          npm run build
          npm test -- --watchAll=false
      - name: npm audit (high/critical blocks)
        working-directory: frontend
        run: npm audit --audit-level=high

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Secret scanning (gitleaks)
        uses: zricethezav/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2

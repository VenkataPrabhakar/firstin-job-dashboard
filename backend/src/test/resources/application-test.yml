# Test profile: H2 for JPA, embedded Kafka for the consumer/DLQ path.
# No Postgres-only DDL anywhere, so these tests stay honest with prod.
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:firstintest;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}

app:
  rate-limit:
    per-minute: 1000

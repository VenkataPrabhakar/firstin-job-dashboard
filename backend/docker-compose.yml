# Local development: single-node Kafka (KRaft) + PostgreSQL 16.
#   docker compose up -d
# Kafka: localhost:9092 (PLAINTEXT inside the compose network only)
# Postgres: localhost:5432, user/password firstin/firstin, db firstin
services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: firstin-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # KRaft requires a real UUID here — any other string fails broker
      # startup ("cluster.id is not valid").
      CLUSTER_ID: "e82ca010-428c-4cc2-9bd5-955c32ed9493"
    volumes:
      - kafka-data:/var/lib/kafka/data

  postgres:
    image: postgres:16
    container_name: firstin-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: firstin
      POSTGRES_PASSWORD: firstin
      POSTGRES_DB: firstin
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  kafka-data:
  postgres-data:
